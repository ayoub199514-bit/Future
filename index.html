<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FURI Mining Algeria v5</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#07111f;--panel:#0d1b2e;--panel2:#11243c;--text:#eef5ff;--muted:#91a4bd;--line:#1e3552;--green:#35d07f;--red:#ff7474}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#06101d,#0a1728);color:var(--text);font-family:Tahoma,Arial,sans-serif}button,input{font:inherit}
button{cursor:pointer}.wrap{max-width:1180px;margin:auto;padding:22px}.logo{font-size:30px;font-weight:900}.logo b{color:var(--green)}
.auth{max-width:560px;margin:7vh auto}.card{background:rgba(13,27,46,.94);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 12px 35px #0002}.hidden{display:none!important}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#081525;color:var(--text)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{padding:11px 15px;border-radius:10px;border:1px solid var(--line);background:#10243a;color:var(--text)}.primary{background:var(--green);color:#06110b;border-color:var(--green);font-weight:800}
.notice{padding:13px;border-radius:11px;background:#241e0b;border:1px solid #5d4b20;color:#ffe7a2;line-height:1.7;margin:14px 0}.error{background:#2a1116;border-color:#65323a;color:#ffc4c4}
.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px}.tag{border:1px solid #2b536f;border-radius:999px;padding:7px 11px;font-size:12px;color:#b9d8ef}
.nav{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0}.nav button{background:#10243a;color:#fff;border:1px solid #294b69;padding:10px 13px;border-radius:9px}.nav button.active{background:#163a4c}
.stat .label{color:var(--muted);font-size:12px}.stat .value{font-size:25px;font-weight:800;margin-top:7px}.section{margin-top:16px}.muted{color:var(--muted);font-size:12px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:right;font-size:12px}.table th{color:var(--muted)}
.status{padding:4px 8px;border-radius:999px;background:#123723;color:#8cf0b3}.danger{background:#3b171c;color:#ffc6c6}.footer{color:var(--muted);font-size:11px;text-align:center;margin-top:20px}
@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.grid,.form{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="auth" class="wrap auth">
 <div class="card">
  <div class="logo">FURI <b>Mining</b></div><div class="muted">v5 • الجزائر • Supabase • BSC</div>
  <div id="msg" class="notice hidden"></div>
  <div id="login">
   <h2>تسجيل الدخول</h2><div class="form">
   <div class="field"><label>البريد الإلكتروني</label><input id="li_email" type="email" autocomplete="email"></div>
   <div class="field"><label>كلمة المرور</label><input id="li_pass" type="password" autocomplete="current-password"></div></div>
   <div class="actions"><button class="btn primary" onclick="signIn()">دخول</button><button class="btn" onclick="toggleAuth()">إنشاء حساب</button></div>
  </div>
  <div id="register" class="hidden">
   <h2>إنشاء حساب</h2><div class="form">
   <div class="field"><label>اسم المستخدم</label><input id="r_user" maxlength="32"></div>
   <div class="field"><label>البريد الإلكتروني</label><input id="r_email" type="email"></div>
   <div class="field"><label>كلمة المرور</label><input id="r_pass" type="password" minlength="8"></div>
   <div class="field"><label>الاسم الأول</label><input id="r_first"></div>
   <div class="field"><label>اسم العائلة</label><input id="r_last"></div>
   <div class="field"><label>تاريخ الميلاد</label><input id="r_dob" type="date" onchange="updateAge()"></div>
   <div class="field"><label>العمر</label><input id="r_age" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" enterkeyhint="done" placeholder="اكتب عمرك" onclick="this.focus()" onfocus="this.removeAttribute('readonly')"></div>
   <div class="field"><label>الدولة</label><input value="الجزائر" readonly></div></div>
   <div class="actions"><button class="btn primary" onclick="signUp()">إنشاء الحساب</button><button class="btn" onclick="toggleAuth()">لدي حساب</button></div>
  </div>
 </div>
</div>

<div id="app" class="wrap hidden">
 <div class="top"><div><div class="logo">FURI <b>Mining</b></div><div id="hello" class="muted"></div></div><div class="tag">DZ • Supabase • v5 • BSC/USDT</div></div>
 <div id="banner" class="notice">الدفع متاح عبر USDT على BNB Smart Chain (BEP20). لا تغيّر الشبكة أثناء الدفع.</div>
 <div class="nav">
  <button data-p="home" onclick="page('home')">الرئيسية</button><button data-p="profile" onclick="page('profile')">الملف الشخصي</button>
  <button data-p="plans" onclick="page('plans')">الباقات</button><button data-p="deposit" onclick="page('deposit')">الإيداع</button><button data-p="withdraw" onclick="page('withdraw')">السحب</button><button data-p="history" onclick="page('history')">السجل</button><button data-p="ledger" onclick="page('ledger')">FURI</button>
  <button data-p="admin" onclick="page('admin')">الإدارة</button><button onclick="logout()">خروج</button>
 </div>
 <div id="content"></div><div class="footer">FURI Mining Algeria v5 — Supabase • BSC • USDT</div>
</div>
<script src="config.js"></script>
<script>
let sb, session, profile;
function showMsg(t,err=false){msg.textContent=t;msg.className='notice '+(err?'error':'');msg.classList.remove('hidden')}
function toggleAuth(){login.classList.toggle('hidden');register.classList.toggle('hidden');msg.classList.add('hidden')}
function age(d){if(!d)return null;let x=new Date(d),n=new Date(),a=n.getFullYear()-x.getFullYear();if(n<new Date(n.getFullYear(),x.getMonth(),x.getDate()))a--;return a}
function maxBirthDate(){const d=new Date();d.setFullYear(d.getFullYear()-18);return d.toISOString().slice(0,10)}
function updateAge(){if(r_dob.value&&r_dob.value>maxBirthDate()){showMsg('يجب أن يكون العمر 18 سنة أو أكثر. اختر تاريخ ميلاد صحيحًا.',true);r_dob.value='';return}if(r_dob.value)r_age.value=age(r_dob.value)??''}

async function init(){
 if(!window.FURI_SUPABASE_URL||!window.FURI_SUPABASE_PUBLISHABLE_KEY){showMsg('ضع بيانات Supabase في config.js أولًا.',true);return}
 sb=window.supabase.createClient(window.FURI_SUPABASE_URL,window.FURI_SUPABASE_PUBLISHABLE_KEY)
 r_dob.max=maxBirthDate()
 const r=await sb.auth.getSession(); session=r.data.session
 if(session) await enter()
 sb.auth.onAuthStateChange((_e,s)=>{session=s;if(s) enter();})
}
async function signUp(){
 const dob=r_dob.value,a=age(dob),manualAge=parseInt(r_age.value,10)
 if(!r_user.value||!r_email.value||!r_pass.value||!r_first.value||!r_last.value||!dob){showMsg('أكمل جميع الحقول.',true);return}
 if(a<18 || !Number.isFinite(manualAge) || manualAge<18 || manualAge>120){showMsg('يجب أن يكون العمر 18 سنة أو أكثر.',true);return}
 const {data,error}=await sb.auth.signUp({email:r_email.value,password:r_pass.value,options:{data:{username:r_user.value.trim(),first_name:r_first.value.trim(),last_name:r_last.value.trim(),date_of_birth:dob,country_code:'DZ'}}})
 if(error){showMsg(error.message,true);return}
 if(data.session) showMsg('تم إنشاء الحساب وتسجيل الدخول.')
 else showMsg('تم إنشاء الحساب. إذا كان تأكيد البريد مفعّلًا في مشروع Supabase، أكمل التأكيد ثم سجّل الدخول.')
}
async function signIn(){
 const {data,error}=await sb.auth.signInWithPassword({email:li_email.value,password:li_pass.value})
 if(error){showMsg('تعذر تسجيل الدخول. تحقق من البيانات أو حالة البريد.',true);return}
 await enter()
}
async function enter(){
 const u=session?.user;if(!u)return
 const r=await sb.from('profiles').select('id,username,first_name,last_name,date_of_birth,country_code,status').eq('id',u.id).single()
 if(r.error){showMsg('تم تسجيل الدخول لكن ملف المستخدم غير متاح. تحقق من migration v3.',true);return}
 profile=r.data;auth.classList.add('hidden');app.classList.remove('hidden');hello.textContent='مرحبًا '+profile.first_name+' '+profile.last_name;page('home')
}
async function logout(){await sb.auth.signOut();session=null;profile=null;app.classList.add('hidden');auth.classList.remove('hidden')}
async function currentFuri(){const r=await sb.from('furi_ledger').select('amount');if(r.error)return '—';return (r.data||[]).reduce((s,x)=>s+Number(x.amount||0),0).toString()}
async function connectTrustWallet(){if(!window.ethereum){showMsg('افتح الموقع داخل Trust Wallet Browser أو متصفح EVM.',true);return null}try{const p=window.ethereum;const a=await p.request({method:'eth_requestAccounts'});if(!a?.[0])throw new Error('لم يتم اختيار محفظة');const ch=await p.request({method:'eth_chainId'});if(ch.toLowerCase()!=='0x38')await p.request({method:'wallet_switchEthereumChain',params:[{chainId:'0x38'}]});return {provider:p,address:a[0]}}catch(e){showMsg(e.message||'تعذر الاتصال بـ Trust Wallet',true);return null}}
async function startPayment(planId){const box=document.getElementById('paymentBox');if(!box)return;box.classList.remove('hidden');const p=await sb.from('plans').select('id,name,price_usdt').eq('id',planId).eq('active',true).single();if(p.error){box.innerHTML='<div class="notice error">الباقة غير متاحة.</div>';return}const w=await connectTrustWallet();if(!w){box.innerHTML='<div class="notice error">تعذر الاتصال بالمحفظة.</div>';return}const cfg=await sb.from('payment_config').select('token_contract,receiving_wallet').eq('id','primary-usdt-bsc').eq('active',true).single();if(cfg.error){box.innerHTML='<div class="notice error">إعدادات الدفع غير متاحة.</div>';return}const x=cfg.data,plan=p.data;const i=await sb.from('payment_intents').insert({user_id:session.user.id,plan_id:plan.id,amount_usdt:plan.price_usdt,network:'BSC',chain_id:56,token_contract:x.token_contract,receiving_wallet:x.receiving_wallet,payer_wallet:w.address,status:'pending'}).select('id').single();if(i.error){box.innerHTML='<div class="notice error">تعذر إنشاء طلب الدفع.</div>';return}const units=tokenUnits(String(plan.price_usdt),18);const data='0xa9059cbb'+pad64(x.receiving_wallet.slice(2))+pad64(units.toString(16));box.innerHTML='<h2>تأكيد الدفع</h2><div class="notice">المبلغ: <b>'+esc(plan.price_usdt)+' USDT</b><br>الشبكة: BNB Smart Chain (BEP20)<br>الاستقبال: '+esc(x.receiving_wallet)+'</div><div class="actions"><button id="sendBtn" class="btn primary">تأكيد التحويل من Trust Wallet</button></div><div id="payStatus" class="muted"></div>';document.getElementById('sendBtn').onclick=async()=>{const b=document.getElementById('sendBtn');b.disabled=true;document.getElementById('payStatus').textContent='بانتظار موافقة Trust Wallet…';try{const tx=await w.provider.request({method:'eth_sendTransaction',params:[{from:w.address,to:x.token_contract,data}]});await sb.from('payment_intents').update({tx_hash:tx,status:'submitted'}).eq('id',i.data.id);const v=await sb.functions.invoke('verify-bsc-usdt-payment',{body:{intent_id:i.data.id,tx_hash:tx}});document.getElementById('payStatus').textContent=v.data?.status==='confirmed'?'تم تأكيد الدفع بعد التحقق من BSC.':'تم إرسال المعاملة؛ التأكيد الحالي: '+(v.data?.confirmations||0)+' / '+(v.data?.required_confirmations||12)}catch(e){b.disabled=false;document.getElementById('payStatus').textContent='أُلغيت العملية أو حدث خطأ: '+(e.message||'غير معروف')}}}
function tokenUnits(v,d){const p=v.split('.');const whole=p[0]||'0',frac=(p[1]||'').padEnd(d,'0').slice(0,d);return BigInt(whole)*(10n**BigInt(d))+BigInt(frac||'0')}
function pad64(v){return v.toLowerCase().padStart(64,'0')}

async function page(p){
 document.querySelectorAll('.nav button[data-p]').forEach(x=>x.classList.toggle('active',x.dataset.p===p))
 let h=''
 if(p==='home')h=`<div class="grid"><div class="card stat"><div class="label">FURI</div><div class="value">${await currentFuri()}</div></div><div class="card stat"><div class="label">الحالة</div><div class="value">${profile.status}</div></div><div class="card stat"><div class="label">العمر</div><div class="value">${age(profile.date_of_birth)}</div></div><div class="card stat"><div class="label">الدولة</div><div class="value">الجزائر</div></div></div>`
 if(p==='profile')h=`<div class="card"><h2>الملف الشخصي</h2><div class="form"><div class="field"><label>اسم المستخدم</label><input value="${esc(profile.username)}" readonly></div><div class="field"><label>الاسم</label><input value="${esc(profile.first_name+' '+profile.last_name)}" readonly></div><div class="field"><label>تاريخ الميلاد</label><input value="${profile.date_of_birth}" readonly></div><div class="field"><label>العمر</label><input value="${age(profile.date_of_birth)}" readonly></div></div></div>`
 if(p==='plans'){let r=await sb.from('plans').select('id,name,price_usdt,duration_days,furi_amount').eq('active',true).order('price_usdt');h='<div class="grid">'+(r.data||[]).map(x=>`<div class="card"><h3>${esc(x.name)}</h3><div class="stat value">${x.price_usdt} USDT</div><div class="muted">${x.duration_days} يوم • ${x.furi_amount} FURI</div><div class="actions"><button class="btn primary" onclick="startPayment('${esc(x.id)}')">الدفع عبر Trust Wallet</button></div></div>`).join('')+'</div><div id="paymentBox" class="card section hidden"></div>'}
 if(p==='deposit')h=await depositPage()
 if(p==='withdraw')h=await withdrawPage()
 if(p==='history')h=await historyPage()
 if(p==='ledger'){let r=await sb.from('furi_ledger').select('amount,entry_type,note,created_at').order('created_at',{ascending:false}).limit(50);h='<div class="card"><h2>سجل FURI</h2>'+(r.error?'<div class="notice error">تعذر قراءة السجل.</div>':table(r.data))+'</div>'}
 if(p==='admin')h=await adminPage()
 content.innerHTML=h
}
async function adminPage(){
 const {data,error}=await sb.rpc('admin_list_profiles')
 if(error)return `<div class="card"><h2>لوحة الإدارة</h2><div class="notice error">هذه المنطقة تتطلب دور إدارة معتمد.</div></div>`
 return `<div class="card"><h2>لوحة الإدارة</h2><div class="muted">المستخدمون: ${data.length}</div>${table(data)}</div>`
}
function table(a){if(!a?.length)return '<div class="muted">لا توجد بيانات.</div>';let cols=Object.keys(a[0]);return '<table class="table"><thead><tr>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+a.map(r=>'<tr>'+cols.map(c=>'<td>'+esc(r[c])+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}
async function depositPage(){const r=await sb.from('deposit_requests').select('amount,tx_hash,status,created_at').eq('user_id',session.user.id).order('created_at',{ascending:false});return '<div class="grid"><div class="card"><h2>إيداع USDT</h2><div class="notice">الشبكة: BNB Smart Chain (BEP20)<br>عنوان الاستقبال: <b>0xA010Ae84fe4230282502086828138ff758809ddC</b></div><div class="field"><label>المبلغ USDT</label><input id="depAmount" type="number" min="0" step="0.000001"></div><div class="field"><label>Tx Hash</label><input id="depTx" placeholder="0x..."></div><div class="actions"><button class="btn primary" onclick="submitDeposit()">إرسال إثبات الإيداع</button></div><div id="depMsg"></div></div><div class="card"><h2>طلبات الإيداع</h2>'+table(r.data)+'</div></div>'}
async function submitDeposit(){const amount=Number(document.getElementById('depAmount').value),tx=document.getElementById('depTx').value.trim();if(!(amount>0)||!/^0x[a-fA-F0-9]{64}$/.test(tx))return showMsg('أدخل مبلغًا صحيحًا وTX Hash صحيحًا.',true);const r=await sb.from('deposit_requests').insert({user_id:session.user.id,amount,tx_hash:tx,network:'BSC',asset:'USDT'});if(r.error)showMsg(r.error.message,true);else{page('deposit')}}
async function withdrawPage(){const r=await sb.from('withdrawal_requests').select('amount,destination_address,status,tx_hash,created_at').eq('user_id',session.user.id).order('created_at',{ascending:false});return '<div class="grid"><div class="card"><h2>طلب سحب USDT</h2><div class="field"><label>المبلغ USDT</label><input id="wdAmount" type="number" min="0" step="0.000001"></div><div class="field"><label>عنوان BSC</label><input id="wdAddress" placeholder="0x..."></div><div class="notice">السحب يُسجل كطلب مراجعة. لا يتم وضع مفتاح خاص في المتصفح.</div><button class="btn primary" onclick="submitWithdrawal()">إرسال طلب السحب</button></div><div class="card"><h2>طلبات السحب</h2>'+table(r.data)+'</div></div>'}
async function submitWithdrawal(){const amount=Number(document.getElementById('wdAmount').value),address=document.getElementById('wdAddress').value.trim();if(!(amount>0)||!/^0x[a-fA-F0-9]{40}$/.test(address))return showMsg('أدخل مبلغًا وعنوان BSC صحيحًا.',true);const r=await sb.from('withdrawal_requests').insert({user_id:session.user.id,amount,destination_address:address,network:'BSC',asset:'USDT'});if(r.error)showMsg(r.error.message,true);else page('withdraw')}
async function historyPage(){const [d,w]=await Promise.all([sb.from('deposit_requests').select('amount,tx_hash,status,created_at').eq('user_id',session.user.id).order('created_at',{ascending:false}),sb.from('withdrawal_requests').select('amount,destination_address,status,tx_hash,created_at').eq('user_id',session.user.id).order('created_at',{ascending:false})]);return '<div class="card"><h2>سجل العمليات</h2><h3>الإيداعات</h3>'+table(d.data||[])+'<h3>السحوبات</h3>'+table(w.data||[])+'</div>'}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]) )}
init()
</script>
</body></html>
